services:
  mysql:
    image: mysql:8.4
    container_name: demand-workbench-mysql
    environment:
      MYSQL_DATABASE: demand_workbench
      MYSQL_USER: demand
      MYSQL_PASSWORD: demand_dev
      MYSQL_ROOT_PASSWORD: root_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
